<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LLM Wiki Study</title>
  <meta name="description" content="A daily review and practice flashcards generated from the LLM Wiki review questions.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='8' width='22' height='16' rx='3' fill='%233b5bdb'/><rect x='9' y='4' width='22' height='16' rx='3' fill='%2391a7ff'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <h1>LLM Wiki <span>Study</span></h1>
      <nav class="tabs" aria-label="Sections">
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/practice" data-tab="practice">Practice</a>
        <a href="#/settings" data-tab="settings">Settings</a>
      </nav>
      <button type="button" class="search-button" id="open-search" aria-haspopup="dialog" aria-label="Search all cards">
        <span aria-hidden="true">⌕</span><span class="search-label">Search</span> <kbd>/</kbd>
      </button>
    </div>
  </header>

  <main class="wrap" id="view">
    <p class="message">Loading cards…</p>
  </main>

  <footer class="wrap footer">
    <p class="keys">
      <kbd>Space</kbd> show answer · <kbd>1</kbd> missed it · <kbd>2</kbd> knew it ·
      <kbd>←</kbd> <kbd>→</kbd> previous / next · <kbd>/</kbd> search or browse · <kbd>Esc</kbd> leave a review
    </p>
    <p>
      Generated from <a id="repo-link" href="https://github.com/GeorgeDanicico/llm-wiki">the wiki's review questions</a><span id="generated"></span>.
      <span id="storage-note">Progress is stored only in this browser.</span>
    </p>
  </footer>

  <dialog id="browser" aria-labelledby="browser-title">
    <div class="dialog-head">
      <h2 id="browser-title">Cards in this session</h2>
      <button type="button" class="close" id="close-browse" aria-label="Close">✕</button>
    </div>
    <input type="search" class="dialog-search" id="browse-filter" placeholder="Filter by question, topic, or ID" aria-label="Filter cards in this session" autocomplete="off">
    <p class="list-summary" id="browse-summary"></p>
    <ol class="card-list" id="browse-list"></ol>
  </dialog>

  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-head">
      <h2 id="search-title">Search all cards</h2>
      <button type="button" class="close" id="close-search" aria-label="Close">✕</button>
    </div>
    <input type="search" class="dialog-search" id="search-input" placeholder="Search by question, topic, or ID" aria-label="Search all cards" autocomplete="off">
    <p class="list-summary" id="search-summary" aria-live="polite"></p>
    <ul class="card-list" id="search-results"></ul>
  </dialog>

  <template id="card-template">
    <article class="card" tabindex="-1">
      <div class="card-meta">
        <span class="topic"></span>
        <span class="card-id"></span>
        <span class="new" hidden>New</span>
        <span class="verdict" hidden></span>
        <span class="box" role="img"></span>
      </div>
      <h3 class="question"></h3>
      <button type="button" class="reveal">Show answer <kbd>Space</kbd></button>
      <div class="answer" hidden>
        <h4>Expected points</h4>
        <ul class="points"></ul>
        <a class="source" target="_blank" rel="noopener"></a>
      </div>
    </article>
    <div class="grade" hidden>
      <button type="button" class="missed">Missed it <kbd>1</kbd></button>
      <button type="button" class="knew">Knew it <kbd>2</kbd></button>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
