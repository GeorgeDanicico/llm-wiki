name: Validate wiki

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so captured sources can be compared with the base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate links, indexes, questions, and source immutability
        if: github.event_name == 'pull_request'
        run: python scripts/validate.py --base "origin/${{ github.base_ref }}"

      - name: Validate links, indexes, and questions
        if: github.event_name != 'pull_request'
        run: python scripts/validate.py
